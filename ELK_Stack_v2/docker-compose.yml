services:
    nginx:
        image: nginx:latest
        container_name: nginx_container_v2
        ports:
            - "8080:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - nginx_logs:/var/log/nginx
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
        container_name: elasticsearch_container_v2
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
        ports:
            - "9200:9200"
        volumes:
            - elastic_data:/usr/share/elasticsearch/data
    kibana:
        image: docker.elastic.co/kibana/kibana:9.1.4
        container_name: kibana_container_v2
        ports:
            - "5601:5601"
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
        depends_on:
            - elasticsearch
    logstash:
        image: docker.elastic.co/logstash/logstash:9.5.4
        container_name: logstash_container_v2
        ports:
            - "5044:5044"
        depends_on:
            - elasticsearch
            - nginx
        volumes:
            - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
    filebeat:
        image: docker.elastic.co/beats/filebeat:9.5.4
        container_name: filebeat_container_v2
        user: root
        command: ["filebeat", "-e", "--strict.perms=false"]
        volumes:
            - nginx_logs:/var/log/nginx:ro
            - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
        depends_on:
            - nginx
            - logstash
    metricbeat:
        image: docker.elastic.co/beats/metricbeat:9.5.4
        container_name: metricbeat_container_v2
        user: root
        command: ["metricbeat", "-e", "--strict.perms=false"]
        volumes:
            - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        depends_on:
            - elasticsearch

volumes:
    elastic_data:
    nginx_logs: