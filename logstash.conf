input {
    file {
        path => "/var/log/nginx/access_lab.log"
        start_position => "beginning"
        sincedb_path => "/dev/null"
        tags => ["nginx_access"]
    }

    file {
        path => "/var/log/nginx/error_lab.log"
        start_position => "beginning"
        sincedb_path => "/dev/null"
        tags => ["nginx_error"]
    }
}

filter {
    grok {
        match => {"message" => "%{COMBINEDAPACHELOG}"}
    }
}

output {
    stdout {codec => rubydebug}
    if "nginx_access" in [tags] {
        elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            index => "nginx-access-lab"
        }
    }

    if "nginx_error" in [tags] {
        elasticsearch {
            hosts => ["http://elasticsearch:9200"]
            index => "nginx-error-lab"
        }
    }
}